<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Every past edition of The Commute Briefing.">
<title>The Commute Briefing — Archive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=Archivo:wght@500;600;700&display=swap">
<style>
  :root {
    --bg: #F6F6F1;
    --surface: #FDFDFA;
    --ink: #1D2422;
    --muted: #4E5955;
    --faint: #79837E;
    --accent: #0E6B70;
    --accent-deep: #0A5257;
    --rule: #DCDED4;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --display: "Fraunces", Georgia, serif;
    --label: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101614;
      --surface: #182019;
      --ink: #E9E7DC;
      --muted: #ABB3AC;
      --faint: #7D857F;
      --accent: #57BEC2;
      --accent-deep: #85D2D5;
      --rule: #2A322E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101614;
    --surface: #182019;
    --ink: #E9E7DC;
    --muted: #ABB3AC;
    --faint: #7D857F;
    --accent: #57BEC2;
    --accent-deep: #85D2D5;
    --rule: #2A322E;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 1.0625rem;
    line-height: 1.75;
    margin: 0;
    padding: 0 1.25rem 4rem;
  }
  .sheet { max-width: 40rem; margin: 0 auto; }
  .masthead {
    display: flex; flex-direction: column; gap: 0.35rem;
    padding: 2.25rem 0 1.1rem;
    border-bottom: 3px solid var(--ink);
    margin-bottom: 2rem;
  }
  .wordmark {
    font-family: var(--label); font-weight: 700; font-size: 0.78rem;
    letter-spacing: 0.22em; text-transform: uppercase;
  }
  .wordmark a { color: inherit; text-decoration: none; }
  .wordmark span { color: var(--accent); }
  .edition-meta {
    font-family: var(--label); font-weight: 500; font-size: 0.72rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint);
  }
  h1 {
    font-family: var(--display); font-weight: 700;
    font-size: 2rem; line-height: 1.15; margin: 0 0 1.5rem;
  }
  .editions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .editions li {
    border-bottom: 1px solid var(--rule);
    padding: 1.1rem 0;
  }
  .ed-meta {
    font-family: var(--label); font-weight: 600; font-size: 0.7rem;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
  }
  .ed-title {
    font-family: var(--display); font-weight: 600; font-size: 1.25rem;
    line-height: 1.3; margin: 0.2rem 0 0.1rem;
  }
  .ed-title a { color: var(--ink); text-decoration: none; }
  .ed-title a:hover, .ed-title a:focus-visible { color: var(--accent-deep); }
  .ed-title a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ed-hook { font-size: 0.97rem; color: var(--muted); font-style: italic; }
  footer {
    margin-top: 3rem; padding-top: 1.1rem; border-top: 1px solid var(--rule);
    font-family: var(--label); font-weight: 500; font-size: 0.74rem;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); line-height: 2;
  }
  footer a { color: var(--accent-deep); }
</style>
</head>
<body>
<div class="sheet">
  <header class="masthead">
    <div class="wordmark"><a href="/">The Commute <span>Briefing</span></a></div>
    <div class="edition-meta">One new thing, every weekday</div>
  </header>

  <h1>All editions</h1>

  <!-- ARCHIVE LIST START (newest first — the daily job prepends one <li> per edition) -->
  <ul class="editions">
    <li>
      <div class="ed-meta">№ 1 · Fri 21 Aug 2026 · Natural science</div>
      <div class="ed-title"><a href="/editions/2026-08-21-when-the-mediterranean-vanished.html">When the Mediterranean Vanished</a></div>
      <div class="ed-hook">The sea that evaporated into a five-kilometre-deep salt desert — and came back in the biggest flood in Earth's history.</div>
    </li>
  </ul>
  <!-- ARCHIVE LIST END -->

  <footer>
    <a href="/">Latest edition →</a>
  </footer>
</div>
</body>
</html>
